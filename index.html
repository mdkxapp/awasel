<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1e2322" />
    <title>AWASEL｜ただいま調整中です</title>
    <link rel="icon" href="assets/awasel-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <style>
      :root{color-scheme:dark;--bg:#171b1a;--panel:#1e2322;--line:#45534f;--text:#f4f1e9;--muted:#b8bfba;--mint:#83e5d2;--yellow:#c4a445}
      *{box-sizing:border-box}
      body{min-height:100svh;margin:0;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:grid;place-items:center;color:var(--text);background:radial-gradient(circle at 75% 18%,rgba(131,229,210,.08),transparent 25rem),var(--bg);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
      main{width:min(100%,620px);padding:clamp(28px,7vw,54px);border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:12px 12px 0 rgba(196,164,69,.11)}
      img{display:block;width:min(100%,360px);height:auto;margin:0 0 44px}
      .status{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--mint);font-size:13px;font-weight:800;letter-spacing:.08em}
      .status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--yellow)}
      h1{margin:0 0 18px;font-size:clamp(30px,7vw,46px);line-height:1.3;letter-spacing:-.03em}
      p{margin:0;color:var(--muted);font-size:16px;line-height:1.9}
      a{display:inline-flex;margin-top:32px;padding:12px 18px;border:1px solid var(--mint);border-radius:9px;color:#10201c;background:var(--mint);font-weight:800;text-decoration:none}
    </style>
  </head>
  <body>
    <main>
      <img src="assets/awasel-lockup.svg" alt="AWASEL" />
      <p class="status">一時公開停止中</p>
      <h1>ただいま、使いやすさを見直しています。</h1>
      <p>より迷わず使える形に整えるため、AWASELの公開を一時停止しています。</p>
      <a href="about-v2.html">MDKΨについて見る</a>
    </main>
  </body>
</html>
